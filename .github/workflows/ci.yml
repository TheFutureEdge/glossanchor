name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/nextjs
      - run: npm run verify
      - run: npm audit --omit=dev
      - run: npm run build
        working-directory: examples/nextjs
      - run: npm audit --omit=dev
        working-directory: examples/nextjs
